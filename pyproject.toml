[project]
name = "query-intelligence-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1", "redis>=5,<7", "celery>=5.4,<6", "boto3>=1.36,<2",
  "openpyxl>=3.1,<4", "reportlab>=4.2,<5", "defusedxml>=0.7,<1",
  "prometheus-client>=0.21,<1", "structlog>=25,<26", "pyjwt[crypto]>=2.10,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "packages*", "workers*"]
exclude = ["tests*", "work*", "outputs*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

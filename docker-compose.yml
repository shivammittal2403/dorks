services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_DB: qi, POSTGRES_USER: qi, POSTGRES_PASSWORD: qi}
    volumes: ["postgres_data:/var/lib/postgresql/data", "./database/migrations:/docker-entrypoint-initdb.d:ro"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U qi"], interval: 5s, timeout: 3s, retries: 20}
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20}
  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data --console-address :9001
    environment: {MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: change-me}
    volumes: ["minio_data:/data"]
  api:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    env_file: [.env]
    ports: ["8000:8000"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
    read_only: true
    tmpfs: [/tmp]
  web:
    build: {context: ., dockerfile: apps/web/Dockerfile}
    environment: {NEXT_PUBLIC_API_URL: http://api:8000}
    ports: ["3000:3000"]
    depends_on: [api]
    read_only: true
    tmpfs: [/tmp]
  orchestrator:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    command: ["celery","-A","workers.orchestrator.tasks:celery","worker","-Q","provider","--loglevel=INFO"]
    env_file: [.env]
    depends_on: {redis: {condition: service_healthy}}
  analyzer:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    command: ["celery","-A","workers.analyzer.tasks:celery","worker","--loglevel=INFO"]
    env_file: [.env]
    depends_on: {redis: {condition: service_healthy}}
  reporter:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    command: ["celery","-A","workers.reporter.tasks:celery","worker","--loglevel=INFO"]
    env_file: [.env]
    depends_on: {redis: {condition: service_healthy}}
volumes: {postgres_data: {}, minio_data: {}}

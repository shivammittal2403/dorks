apiVersion: v1
kind: Namespace
metadata: {name: query-intelligence}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: query-intelligence}
spec:
  replicas: 2
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      serviceAccountName: api
      containers:
        - name: api
          image: ghcr.io/example/query-intelligence-api:latest
          ports: [{containerPort: 8000}]
          readinessProbe: {httpGet: {path: /healthz, port: 8000}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: 8000}, initialDelaySeconds: 15}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: {drop: ["ALL"]}}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: api, namespace: query-intelligence}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: query-intelligence}
spec: {selector: {app: api}, ports: [{port: 8000, targetPort: 8000}]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: query-intelligence}
spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
